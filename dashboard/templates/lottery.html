<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Data Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .filter-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        select, input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--accent-blue);
            color: #0f172a;
            align-self: flex-end;
            margin-bottom: 2px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .data-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            min-height: 400px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .region-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
        }
        .region-MB { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .region-MT { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .region-MN { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }

        .numbers-cell {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-green);
            letter-spacing: 1px;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .board-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
        }

        .lottery-board {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }
        
        .lottery-board:hover {
            transform: translateY(-2px);
        }

        .board-header {
            background: rgba(56, 189, 248, 0.08);
            padding: 1.2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
        }

        .board-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .board-date {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .prize-row {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .prize-row:last-child {
            border-bottom: none;
        }

        .prize-name {
            width: 70px;
            padding: 0.8rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.25);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }
        
        .prize-row.prize-db .prize-name {
            color: #ef4444;
            font-weight: 700;
        }

        .prize-numbers {
            flex: 1;
            padding: 0.8rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .prize-numbers span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 2px;
        }
        
        .prize-row.prize-db .prize-numbers span {
            color: #ef4444;
            font-size: 1.5rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Sổ Số Toàn Quốc (Lottery Data)</h1>
        <p style="color: var(--text-muted);">Dữ liệu cào tự động và lưu trữ theo từng quý</p>
    </div>

    <div class="container">
        <div class="filter-panel">
            <div class="filter-group">
                <label for="exact_date">Ngày cụ thể</label>
                <input type="date" id="exact_date">
            </div>
            <div class="filter-group">
                <label for="region">Miền</label>
                <select id="region" onchange="fetchData()">
                    <option value="ALL">Tất cả (All)</option>
                    <option value="MB">Miền Bắc (MB)</option>
                    <option value="MT">Miền Trung (MT)</option>
                    <option value="MN">Miền Nam (MN)</option>
                </select>
            </div>
        </div>

        <div class="data-panel">
            <div id="table-container">
                <div class="loading">Đang tải dữ liệu...</div>
            </div>
        </div>
    </div>

    <script>
        const exactDateInput = document.getElementById('exact_date');
        const regionInput = document.getElementById('region');

        // Khởi tạo giá trị mặc định là hôm nay
        const now = new Date();
        const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        
        exactDateInput.value = todayStr;
        exactDateInput.addEventListener('change', () => {
            fetchData();
        });

        async function fetchData() {
            const region = regionInput.value;
            const exact_date = exactDateInput.value;
            
            const container = document.getElementById('table-container');

            container.innerHTML = '<div class="loading">Đang tải dữ liệu...</div>';

            try {
                let url = `/api/lottery/data?region=${region}`;
                if (exact_date) {
                    url += `&exact_date=${exact_date}`;
                }
                
                const response = await fetch(url);
                const data = await response.json();

                if (!data.file_exists) {
                    container.innerHTML = `<div class="empty-state">Không tìm thấy dữ liệu.<br>Hãy chắc chắn Lottery Scraper đã chạy.</div>`;
                    return;
                }

                if (data.data.length === 0) {
                    if (exact_date) {
                        const dStr = exact_date.split('-').reverse().join('/');
                        container.innerHTML = `<div class="empty-state">Không có kết quả xổ số nào vào ngày <b>${dStr}</b>.</div>`;
                    } else {
                        container.innerHTML = `<div class="empty-state">Không có dữ liệu phù hợp với bộ lọc.</div>`;
                    }
                    return;
                }

                renderTable(data.data);
            } catch (error) {
                container.innerHTML = `<div class="empty-state" style="color: #ef4444;">Lỗi khi tải dữ liệu: ${error.message}</div>`;
            }
        }

        function renderTable(data) {
            // Group data by Date and Province
            const grouped = {};
            data.forEach(row => {
                const key = `${row.Date}_${row.Province}`;
                if (!grouped[key]) {
                    grouped[key] = {
                        date: row.Date,
                        province: row.Province,
                        region: row.Region,
                        prizes: {}
                    };
                }
                // Split numbers by " - " if available
                grouped[key].prizes[row.Prize] = row.Numbers ? row.Numbers.split(' - ') : [];
            });

            // Sort dates descending, then by province
            const boards = Object.values(grouped).sort((a, b) => {
                if (a.date > b.date) return -1;
                if (a.date < b.date) return 1;
                return a.province.localeCompare(b.province);
            });

            let html = '<div class="board-container">';

            boards.forEach(board => {
                // Đổi format ngày từ YYYY-MM-DD sang DD/MM/YYYY cho đẹp
                const dateParts = board.date.split('-');
                const displayDate = dateParts.length === 3 ? `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}` : board.date;

                html += `
                    <div class="lottery-board">
                        <div class="board-header">
                            <div class="board-title">${board.province} <span style="font-size: 0.75rem; vertical-align: middle; margin-left: 5px;" class="region-badge region-${board.region}">${board.region}</span></div>
                            <div class="board-date">Ngày: ${displayDate}</div>
                        </div>
                `;

                // Standard prize order
                const prizeOrder = ['ĐB', '1', '2', '3', '4', '5', '6', '7', '8'];
                
                prizeOrder.forEach(p => {
                    if (board.prizes[p] && board.prizes[p].length > 0) {
                        const isDB = p === 'ĐB';
                        const pName = isDB ? 'ĐB' : `G.${p}`;
                        const numsHtml = board.prizes[p].map(n => `<span>${n}</span>`).join('');
                        
                        html += `
                        <div class="prize-row ${isDB ? 'prize-db' : ''}">
                            <div class="prize-name">${pName}</div>
                            <div class="prize-numbers">${numsHtml}</div>
                        </div>
                        `;
                    }
                });

                html += `</div>`; // Close board
            });

            html += '</div>';

            document.getElementById('table-container').innerHTML = html;
        }
        
        // Auto fetch on load
        fetchData();
    </script>
</body>
</html>
