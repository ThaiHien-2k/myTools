<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Server Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); min-height: 100vh; padding: 2rem; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -1px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-success { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-success:hover { background: rgba(16, 185, 129, 0.3); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
        .btn-icon { background: transparent; color: var(--text-muted); padding: 0.4rem; border-radius: 4px; }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: white; }
        
        .list-container { display: flex; flex-direction: column; gap: 0.8rem; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; backdrop-filter: blur(10px); display: flex; flex-direction: column; overflow: hidden; transition: all 0.2s; }
        
        .card-header { padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; gap: 1rem; }
        .card-header:hover { background: rgba(255, 255, 255, 0.03); }
        
        .project-info-main { display: flex; align-items: center; gap: 0.8rem; flex: 1; min-width: 0; }
        .project-title { font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f8fafc; }
        .project-path { font-size: 0.8rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; word-break: break-all; }
        
        .expand-icon { font-size: 0.8rem; color: var(--text-muted); transition: transform 0.2s; width: 16px; text-align: center; }
        .card.expanded .expand-icon { transform: rotate(180deg); }
        
        .card-actions-top { display: flex; gap: 0.5rem; flex-shrink: 0; align-items: center; }
        
        .card-body { padding: 0 1.2rem 1.2rem 1.2rem; display: none; flex-direction: column; gap: 1rem; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 0; padding-top: 1.2rem; }
        .card.expanded .card-body { display: flex; }
        .card.dragging { opacity: 0.4; border: 2px dashed var(--accent-blue); }
        .card.drag-over { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.05); }
        .drag-handle { cursor: grab; color: var(--text-muted); font-size: 1.1rem; opacity: 0.4; transition: opacity 0.2s; user-select: none; padding: 0 4px; flex-shrink: 0; }
        .card:hover .drag-handle { opacity: 0.8; }
        .project-title { font-size: 1.1rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; color: #f8fafc; cursor: text; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
        .project-title .name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .project-title .edit-icon { font-size: 0.75rem; opacity: 0; transition: opacity 0.2s; flex-shrink: 0; }
        .card:hover .project-title .edit-icon { opacity: 0.7; }
        .project-title input { font-size: 1.1rem; font-weight: 600; background: rgba(255,255,255,0.08); border: 1px solid var(--accent-blue); border-radius: 6px; color: var(--text-main); padding: 0.1rem 0.4rem; width: 180px; outline: none; font-family: 'Inter', sans-serif; }
        
        .badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 500; background: rgba(255,255,255,0.1); white-space: nowrap; }
        .badge.framework { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
        .status-badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; white-space: nowrap; margin-left: auto; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .running .status-dot { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .stopped .status-dot { background: var(--text-muted); }
        .running { color: var(--accent-green); }
        
        .scripts-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .script-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .script-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
        .script-btn.active { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--accent-green); }
        .script-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .info-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }
        
        .card-actions { display: flex; gap: 0.5rem; }
        
        .terminal-container { background: #000; border-radius: 8px; border: 1px solid #333; margin-top: 1rem; display: none; flex-direction: column; height: 300px; overflow: hidden; }
        .terminal-container.visible { display: flex; }
        .terminal-output { flex: 1; padding: 10px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #a3be8c; white-space: pre-wrap; word-wrap: break-word; }
        .terminal-input { display: flex; border-top: 1px solid #333; background: #111; }
        .terminal-input input { flex: 1; background: transparent; border: none; color: #fff; font-family: 'JetBrains Mono', monospace; padding: 10px; outline: none; }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        .toast { background: rgba(30, 41, 59, 0.9); color: white; padding: 12px 20px; border-radius: 8px; margin-top: 10px; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: slideIn 0.3s ease forwards; }
        .toast.error { border-left: 4px solid var(--accent-red); }
        .toast.success { border-left: 4px solid var(--accent-green); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: var(--bg-color); border: 1px solid var(--card-border); padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; }
        .modal h2 { margin-bottom: 1rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .input-group input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); color: white; font-family: 'JetBrains Mono', monospace; }
        .input-group input:focus { outline: none; border-color: var(--accent-blue); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; }
        
        .link { color: var(--accent-blue); text-decoration: none; display: flex; align-items: center; gap: 0.3rem; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dev Server Manager</h1>
        <div style="display: flex; gap: 1rem;">
            <button class="btn" onclick="window.location.href='/'">← Dashboard</button>
            <button class="btn btn-primary" onclick="showAddModal()">+ Add Project</button>
        </div>
    </div>

    <div class="list-container" id="projects-grid">
        <!-- Cards generated here -->
    </div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <h2>Add Dev Project</h2>
            <div class="input-group">
                <label>Absolute path to project directory</label>
                <input type="text" id="project-path" placeholder="C:\laragon\www\my-app" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="hideAddModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addProject()">Add</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        let projectsData = [];
        let logIntervals = {};

        function formatUptime(seconds) {
            if (!seconds) return '0s';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h}h ${m}m`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        async function fetchProjects() {
            try {
                const res = await fetch('/api/dev_manager/projects');
                projectsData = await res.json();
                renderProjects();
            } catch (error) {
                showToast('Error loading projects', 'error');
            }
        }

        function renderProjects() {
            const grid = document.getElementById('projects-grid');
            
            projectsData.forEach(proj => {
                const isRunning = proj.status === 'Running';
                let card = document.getElementById(`proj-${proj.id}`);
                
                let scriptsHtml = '';
                if (proj.scripts) {
                    for (const [sName, sCmd] of Object.entries(proj.scripts)) {
                        const isActive = isRunning && proj.current_script === sName;
                        const btnClass = isActive ? 'script-btn active' : 'script-btn';
                        const icon = isActive ? '🔄' : '▶';
                        scriptsHtml += `<button class="${btnClass}" onclick="startScript(this, '${proj.id}', '${sName}')" title="${sCmd}" ${(isRunning && !isActive) ? 'disabled' : ''}>${icon} ${sName}</button>`;
                    }
                }
                
                if (!card) {
                    card = document.createElement('div');
                    card.id = `proj-${proj.id}`;
                    card.className = 'card';
                    grid.appendChild(card);
                    
                    card.innerHTML = `
                        <div class="card-header" onclick="toggleCard('${proj.id}')">
                            <div class="project-info-main">
                                <span class="drag-handle" onclick="event.stopPropagation()">⠿</span>
                                <span class="expand-icon">▼</span>
                                <div class="project-title" id="proj-name-${proj.id}" ondblclick="event.stopPropagation(); startProjRename('${proj.id}')" title="Double-click để đổi tên">
                                    <span class="name-text">${proj.name}</span>
                                    <span class="edit-icon">✏️</span>
                                </div>
                                <span class="badge framework">${proj.framework}</span>
                                <span class="badge v">${proj.version}</span>
                                <span class="badge" style="background: rgba(56, 189, 248, 0.1); color: var(--accent-blue);">${proj.pkg_mgr || 'npm'}</span>
                                <span class="status-badge ${isRunning ? 'running' : 'stopped'}" id="status-badge-${proj.id}">
                                    <span class="status-dot"></span>
                                    ${isRunning ? `Running (${proj.current_script})` : 'Stopped'}
                                </span>
                            </div>
                            <div class="card-actions-top" onclick="event.stopPropagation()">
                                <span id="uptime-${proj.id}" style="font-size: 0.85rem; color: var(--text-muted); margin-right: 1rem; width: 60px; text-align: right; display: inline-block;">${formatUptime(proj.uptime)}</span>
                                <button class="btn btn-danger" id="stop-btn-${proj.id}" onclick="stopProject('${proj.id}')" ${!isRunning ? 'disabled' : ''} style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">⏹ Stop</button>
                                <button class="btn-icon" title="Refresh package.json" onclick="refreshProject('${proj.id}')">🔄</button>
                                <button class="btn-icon" title="Delete" onclick="deleteProject('${proj.id}')">🗑️</button>
                            </div>
                        </div>
                        
                        <div class="card-body">
                            <div class="info-row">
                                <span>Path: <span class="project-path" style="user-select: all;">${proj.path}</span></span>
                            </div>
                            
                            <div class="scripts-list" id="scripts-${proj.id}">
                                ${scriptsHtml || '<span style="color:var(--text-muted);font-size:0.85rem">No scripts found</span>'}
                            </div>
                            
                            <div id="url-container-${proj.id}">
                            ${proj.url ? `
                            <div class="info-row">
                                <span>Detected URL: <a href="${proj.url}" target="_blank" class="link">${proj.url} ↗</a></span>
                            </div>
                            ` : ''}
                            </div>
                            
                            <div class="card-actions">
                                <button class="btn" style="background: rgba(255,255,255,0.1); color: white;" onclick="toggleTerminal('${proj.id}')">📋 Logs</button>
                                <button class="btn" style="background: rgba(56, 189, 248, 0.1); color: var(--accent-blue);" onclick="openVSCode('${proj.id}')">💻 VSCode</button>
                                <label style="display:flex; align-items:center; gap: 0.4rem; font-size: 0.8rem; margin-left: auto; cursor:pointer; color: var(--text-muted);">
                                    <input type="checkbox" id="autostart-${proj.id}" ${proj.auto_start ? 'checked' : ''} onchange="toggleAutoStart('${proj.id}')"> Auto Start
                                </label>
                            </div>
                            
                            <div class="terminal-container" id="term-${proj.id}">
                                <div class="terminal-output" id="term-out-${proj.id}"></div>
                                <div class="terminal-input">
                                    <input type="text" id="term-in-${proj.id}" placeholder="Enter command (stdin)..." onkeypress="handleTerminalInput(event, '${proj.id}')">
                                </div>
                            </div>
                        </div>
                    `;
                    
                    if (isRunning && !logIntervals[proj.id]) {
                        logIntervals[proj.id] = setInterval(() => fetchLogs(proj.id), 1500);
                        fetchLogs(proj.id);
                    }
                } else {
                    const scriptsList = document.getElementById(`scripts-${proj.id}`);
                    if (scriptsList && !scriptsList.innerHTML.includes('Starting...')) {
                        scriptsList.innerHTML = scriptsHtml || '<span style="color:var(--text-muted);font-size:0.85rem">No scripts found</span>';
                    }
                    
                    const badge = document.getElementById(`status-badge-${proj.id}`);
                    if (badge) {
                        badge.className = `status-badge ${isRunning ? 'running' : 'stopped'}`;
                        badge.innerHTML = `<span class="status-dot"></span>${isRunning ? `Running (${proj.current_script})` : 'Stopped'}`;
                    }
                    
                    const uptime = document.getElementById(`uptime-${proj.id}`);
                    if (uptime) uptime.textContent = formatUptime(proj.uptime);
                    
                    const urlContainer = document.getElementById(`url-container-${proj.id}`);
                    if (urlContainer) {
                        urlContainer.innerHTML = proj.url ? `
                        <div class="info-row">
                            <span>Detected URL: <a href="${proj.url}" target="_blank" class="link">${proj.url} ↗</a></span>
                        </div>` : '';
                    }
                    
                    const stopBtn = document.getElementById(`stop-btn-${proj.id}`);
                    if (stopBtn) stopBtn.disabled = !isRunning;
                    
                    const autoStart = document.getElementById(`autostart-${proj.id}`);
                    if (autoStart && document.activeElement !== autoStart) {
                        autoStart.checked = proj.auto_start;
                    }
                    
                    if (isRunning && !logIntervals[proj.id]) {
                        logIntervals[proj.id] = setInterval(() => fetchLogs(proj.id), 1500);
                    } else if (!isRunning && logIntervals[proj.id]) {
                        clearInterval(logIntervals[proj.id]);
                        delete logIntervals[proj.id];
                    }
                }
            });

            // Remove deleted cards
            Array.from(grid.children).forEach(card => {
                const id = card.id.replace('proj-', '');
                if (!projectsData.find(p => p.id === id)) {
                    card.remove();
                    if(logIntervals[id]) {
                        clearInterval(logIntervals[id]);
                        delete logIntervals[id];
                    }
                }
            });

            // Re-init drag and drop for any new cards
            initDragAndDrop();
        }
        
        function toggleCard(id) {
            const card = document.getElementById(`proj-${id}`);
            if (card) card.classList.toggle('expanded');
        }

        // ===== DRAG AND DROP =====
        let draggingCard = null;
        function initDragAndDrop() {
            const cards = document.querySelectorAll('#projects-grid .card');
            cards.forEach(card => {
                const handle = card.querySelector('.drag-handle');
                if (!handle || handle._dndReady) return;
                handle._dndReady = true;
                handle.addEventListener('mousedown', () => { card.draggable = true; });
                document.addEventListener('mouseup', () => { if(card) card.draggable = false; });
                card.addEventListener('dragstart', e => {
                    draggingCard = card;
                    setTimeout(() => card.classList.add('dragging'), 0);
                    e.dataTransfer.effectAllowed = 'move';
                });
                card.addEventListener('dragend', () => {
                    card.draggable = false;
                    card.classList.remove('dragging');
                    draggingCard = null;
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
                    saveProjOrder();
                });
                card.addEventListener('dragover', e => {
                    e.preventDefault();
                    if (!draggingCard || card === draggingCard) return;
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
                    card.classList.add('drag-over');
                    const grid = document.getElementById('projects-grid');
                    const bounding = card.getBoundingClientRect();
                    if (e.clientY - bounding.top > bounding.height / 2) {
                        grid.insertBefore(draggingCard, card.nextSibling);
                    } else {
                        grid.insertBefore(draggingCard, card);
                    }
                });
                card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
                card.addEventListener('drop', e => { e.preventDefault(); card.classList.remove('drag-over'); });
            });
        }

        async function saveProjOrder() {
            const order = Array.from(document.querySelectorAll('#projects-grid .card')).map(c => c.id.replace('proj-', ''));
            await fetch('/api/dev_manager/projects/reorder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order })
            });
        }

        // ===== INLINE RENAME =====
        function startProjRename(id) {
            const el = document.getElementById(`proj-name-${id}`);
            if (!el || el.querySelector('input')) return;
            const currentName = el.querySelector('.name-text').textContent.trim();
            el.innerHTML = `<input id="pname-in-${id}" value="${currentName}" onblur="finishProjRename('${id}', '${currentName.replace(/'/g,"\\'")}')"
                onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape') cancelProjRename('${id}', '${currentName.replace(/'/g,"\\'")}')">` ;
            const input = document.getElementById(`pname-in-${id}`);
            input.focus(); input.select();
        }

        async function finishProjRename(id, original) {
            const input = document.getElementById(`pname-in-${id}`);
            if (!input) return;
            const newName = input.value.trim() || original;
            const el = document.getElementById(`proj-name-${id}`);
            el.innerHTML = `<span class="name-text">${newName}</span><span class="edit-icon">✏️</span>`;
            el.ondblclick = e => { e.stopPropagation(); startProjRename(id); };
            if (newName === original) return;
            const res = await fetch(`/api/dev_manager/projects/${id}/rename`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName })
            });
            const data = await res.json();
            showToast(data.success ? `Đã đổi tên thành "${newName}"` : data.message, data.success ? 'success' : 'error');
        }

        function cancelProjRename(id, original) {
            const el = document.getElementById(`proj-name-${id}`);
            if (el) {
                el.innerHTML = `<span class="name-text">${original}</span><span class="edit-icon">✏️</span>`;
                el.ondblclick = e => { e.stopPropagation(); startProjRename(id); };
            }
        }

        function toggleTerminal(id) {
            const term = document.getElementById(`term-${id}`);
            if (term) term.classList.toggle('visible');
            if (term.classList.contains('visible')) fetchLogs(id);
        }

        async function fetchLogs(id) {
            try {
                const res = await fetch(`/api/dev_manager/projects/${id}/logs`);
                const data = await res.json();
                const out = document.getElementById(`term-out-${id}`);
                if (out && data.logs) {
                    const isScrolledToBottom = out.scrollHeight - out.clientHeight <= out.scrollTop + 30;
                    const newContent = data.logs.join('\n') || "No logs available...";
                    if (out.textContent !== newContent) {
                        out.textContent = newContent;
                        if (isScrolledToBottom) out.scrollTop = out.scrollHeight;
                    }
                }
            } catch (e) {}
        }

        async function handleTerminalInput(e, id) {
            if (e.key === 'Enter') {
                const input = document.getElementById(`term-in-${id}`);
                const val = input.value;
                if (!val) return;
                input.value = '';
                try {
                    await fetch(`/api/dev_manager/projects/${id}/input`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ input: val })
                    });
                    fetchLogs(id);
                } catch (e) {}
            }
        }

        async function startScript(btn, id, script) {
            const card = document.getElementById(`proj-${id}`);
            if (card) {
                const buttons = card.querySelectorAll('.script-btn');
                buttons.forEach(b => b.disabled = true);
            }
            
            const isRestart = btn && btn.classList.contains('active');
            if (btn) btn.innerHTML = isRestart ? `⏳ Restarting...` : `⏳ Starting...`;

            if (isRestart) {
                await fetch(`/api/dev_manager/projects/${id}/stop`, { method: 'POST' });
                await new Promise(r => setTimeout(r, 1000));
            }

            const res = await fetch(`/api/dev_manager/projects/${id}/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ script })
            });
            const data = await res.json();
            if(!data.success) showToast(data.message, 'error');
            fetchProjects();
        }

        async function stopProject(id) {
            const res = await fetch(`/api/dev_manager/projects/${id}/stop`, { method: 'POST' });
            const data = await res.json();
            if(!data.success) showToast(data.message, 'error');
            fetchProjects();
        }

        async function toggleAutoStart(id) {
            await fetch(`/api/dev_manager/projects/${id}/toggle_autostart`, { method: 'POST' });
            fetchProjects();
        }

        async function refreshProject(id) {
            const res = await fetch(`/api/dev_manager/projects/${id}/refresh`, { method: 'POST' });
            const data = await res.json();
            if(data.success) showToast('Refreshed package.json', 'success');
            else showToast(data.message, 'error');
            fetchProjects();
        }

        async function openVSCode(id) {
            await fetch(`/api/dev_manager/projects/${id}/open_vscode`, { method: 'POST' });
        }

        async function deleteProject(id) {
            if (confirm('Remove this project?')) {
                await fetch(`/api/dev_manager/projects/${id}`, { method: 'DELETE' });
                fetchProjects();
            }
        }

        // Modal
        function showAddModal() {
            document.getElementById('add-modal').style.display = 'flex';
            document.getElementById('project-path').focus();
        }
        function hideAddModal() {
            document.getElementById('add-modal').style.display = 'none';
            document.getElementById('project-path').value = '';
        }
        async function addProject() {
            const path = document.getElementById('project-path').value;
            if (!path) return;
            const res = await fetch('/api/dev_manager/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path })
            });
            const data = await res.json();
            if (data.success) {
                hideAddModal();
                showToast('Project added!', 'success');
                fetchProjects();
            } else {
                showToast(data.message, 'error');
            }
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = "toast " + type;
            toast.textContent = msg;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        fetchProjects();
        setInterval(fetchProjects, 2000); // Polling for status updates
    </script>
</body>
</html>
