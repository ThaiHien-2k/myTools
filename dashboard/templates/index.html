<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myTools Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/asset/favicon/my-tools-favicon.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/asset/favicon/my-tools-favicon.png?v=2" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.4);
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.4);
            --accent-blue: #38bdf8;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .header {
            margin-bottom: 3rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .tool-info {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-grow: 1;
        }

        .tool-name {
            font-size: 1.2rem;
            font-weight: 600;
            min-width: 200px;
            cursor: text;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tool-name span.edit-icon {
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.2s;
            color: var(--text-muted);
        }
        .card:hover .tool-name span.edit-icon { opacity: 1; }
        .tool-name input {
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--accent-blue);
            border-radius: 6px;
            color: var(--text-main);
            padding: 0.1rem 0.4rem;
            width: 100%;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .drag-handle {
            cursor: grab;
            color: var(--text-muted);
            padding: 0 0.5rem;
            font-size: 1.2rem;
            opacity: 0.4;
            transition: opacity 0.2s;
            flex-shrink: 0;
            user-select: none;
        }
        .card:hover .drag-handle { opacity: 0.8; }
        .card.dragging { opacity: 0.4; border: 2px dashed var(--accent-blue); }
        .card.drag-over { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.05); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.running {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge.stopped {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .running .status-indicator {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .stopped .status-indicator {
            background-color: var(--accent-red);
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-start { background: var(--accent-green); color: white; }
        .btn-stop { background: var(--accent-red); color: white; }
        .btn-view { background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); border: 1px solid rgba(56, 189, 248, 0.2); }
        .btn-view.active { background: var(--accent-blue); color: white; }
        .btn-openlog { background: rgba(250, 204, 21, 0.1); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.25); font-size: 0.78rem; padding: 0.4rem 0.7rem; }
        .btn-openlog:hover { background: rgba(250, 204, 21, 0.2); }
        .btn-restart { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
        .btn-restart:hover { background: rgba(168, 85, 247, 0.3); }

        .terminal {
            background: #000;
            color: #0f0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            padding: 0;
            border-radius: 8px;
            height: 0;
            overflow: hidden;
            border: 0px solid #333;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            margin-top: 0;
        }

        .terminal.visible {
            height: 250px;
            padding: 15px;
            opacity: 1;
            border-width: 1px;
            margin-top: 1rem;
            overflow-y: auto;
        }

        .terminal.expanded {
            height: 600px;
        }

        .terminal-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .expand-btn {
            position: sticky;
            float: right;
            top: 0;
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 10;
        }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .toast {
            background: rgba(30, 41, 59, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease forwards;
        }

        .toast.error { border-left: 4px solid var(--accent-red); }
        .toast.success { border-left: 4px solid var(--accent-green); }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>myTools Control Center</h1>
        <div style="display: flex; gap: 0.75rem; justify-content: center; margin-top: 0.5rem;">
            <button id="restart-dashboard-btn" class="btn btn-restart" onclick="restartDashboard()">
                &#x21BB; Restart Dashboard
            </button>
            <button onclick="shutdownDashboard()" class="btn btn-stop">
                &#x23FB; Shutdown Dashboard
            </button>
        </div>
    </div>

    <div class="grid" id="tools-container"></div>
    <div id="toast-container"></div>

    <script>
        const container = document.getElementById('tools-container');

        async function fetchTools() {
            try {
                const res = await fetch('/api/tools');
                const tools = await res.json();
                renderTools(tools);
            } catch (error) { showToast('Error loading tools!', 'error'); }
        }

        function renderTools(tools) {
            tools.forEach(tool => {
                const isRunning = tool.status === 'Running';
                let card = document.getElementById(`card-${tool.id}`);

                if (!card) {
                    // === Lần đầu: TẠO thẻ mới ===
                    card = document.createElement('div');
                    card.id = `card-${tool.id}`;
                    card.className = 'card';

                    const badgeClass = isRunning ? 'running' : 'stopped';
                    card.innerHTML = `
                        <div class="card-top">
                            <span class="drag-handle" draggable="false">⠿</span>
                            <div class="tool-info">
                                <h2 class="tool-name" id="name-${tool.id}" ondblclick="startRename('${tool.id}')">
                                    <span class="name-text">${tool.name}</span>
                                    <span class="edit-icon" title="Double-click để đổi tên">✏️</span>
                                </h2>
                                <span class="status-badge ${badgeClass}" id="badge-${tool.id}">
                                    <span class="status-indicator"></span>
                                    ${tool.status}
                                </span>
                            </div>
                            <div class="actions" id="actions-${tool.id}">
                                ${tool.id === 'weather_forecast' && isRunning ? `<button id="webui-btn-weather" class="btn btn-view" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border-color: rgba(16, 185, 129, 0.2);" onclick="window.open('/nowcast', '_blank')">Web UI ↗</button>` : ''}
                                ${tool.id === 'lock_tracker' && isRunning ? `<button id="webui-btn-lock" class="btn btn-view" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border-color: rgba(16, 185, 129, 0.2);" onclick="window.open('/lock', '_blank')">Web UI ↗</button>` : ''}
                                ${tool.id === 'lottery_scraper' && isRunning ? `<button id="webui-btn-lottery" class="btn btn-view" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border-color: rgba(16, 185, 129, 0.2);" onclick="window.open('/lottery', '_blank')">Web UI ↗</button>` : ''}
                                ${tool.id === 'npm_manager' && isRunning ? `<button id="webui-btn-npm" class="btn btn-view" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border-color: rgba(16, 185, 129, 0.2);" onclick="window.open('/dev_manager', '_blank')">Web UI ↗</button>` : ''}
                                ${tool.id === 'scan_network' ? `<button class="btn btn-openlog" id="npp-btn-${tool.id}" onclick="openLogInEditor('${tool.id}')" title="Mở log bằng Notepad++">📄 NPP</button>` : ''}
                                <button class="btn btn-view" id="log-btn-${tool.id}" onclick="toggleLogs('${tool.id}')">Logs</button>
                                <button class="btn btn-start" id="start-btn-${tool.id}" onclick="startTool('${tool.id}')" ${isRunning ? 'disabled' : ''}>Start</button>
                                <button class="btn btn-stop"  id="stop-btn-${tool.id}"  onclick="stopTool('${tool.id}')"  ${!isRunning ? 'disabled' : ''}>Stop</button>
                            </div>
                        </div>
                        ${!tool.has_gui ? `
                            <div class="terminal" id="log-${tool.id}">
                                <button class="expand-btn" onclick="toggleExpand('${tool.id}')">Maximize</button>
                                <div class="terminal-content" id="log-content-${tool.id}">Waiting for logs...</div>
                            </div>` : ''}
                    `;
                    container.appendChild(card);
                } else {
                    // === Lần sau: CHỈ CẬP NHẬT các phần thay đổi (tránh giật) ===
                    const badge = document.getElementById(`badge-${tool.id}`);
                    if (badge) {
                        badge.className = `status-badge ${isRunning ? 'running' : 'stopped'}`;
                        badge.innerHTML = `<span class="status-indicator"></span>${tool.status}`;
                    }

                    const startBtn = document.getElementById(`start-btn-${tool.id}`);
                    const stopBtn  = document.getElementById(`stop-btn-${tool.id}`);
                    if (startBtn) startBtn.disabled = isRunning;
                    if (stopBtn)  stopBtn.disabled  = !isRunning;

                    // Cập nhật nút Web UI
                    if (tool.id === 'weather_forecast' || tool.id === 'lock_tracker' || tool.id === 'lottery_scraper' || tool.id === 'npm_manager') {
                        const actionsDiv = document.getElementById(`actions-${tool.id}`);
                        if (actionsDiv) {
                            const btnId = tool.id === 'weather_forecast' ? 'webui-btn-weather' : (tool.id === 'lock_tracker' ? 'webui-btn-lock' : (tool.id === 'lottery_scraper' ? 'webui-btn-lottery' : 'webui-btn-npm'));
                            let webBtn = document.getElementById(btnId);
                            if (isRunning && !webBtn) {
                                webBtn = document.createElement('button');
                                webBtn.id = btnId;
                                webBtn.className = 'btn btn-view';
                                webBtn.style.cssText = 'background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border-color: rgba(16, 185, 129, 0.2);';
                                webBtn.textContent = 'Web UI ↗';
                                webBtn.onclick = () => window.open(tool.id === 'weather_forecast' ? '/nowcast' : (tool.id === 'lock_tracker' ? '/lock' : (tool.id === 'lottery_scraper' ? '/lottery' : '/dev_manager')), '_blank');
                                actionsDiv.prepend(webBtn);
                            } else if (!isRunning && webBtn) {
                                webBtn.remove();
                            }
                        }
                    }
                }
            });

            // Khởi động log interval 1 lần
            if (!window.logIntervals) window.logIntervals = {};
            tools.forEach(tool => {
                if (!tool.has_gui && !window.logIntervals[tool.id]) {
                    window.logIntervals[tool.id] = setInterval(() => fetchLogs(tool.id), 2000);
                    fetchLogs(tool.id);
                }
            });
            // Re-init drag and drop each time new cards are added
            initDragAndDrop();
        }

        // ===== DRAG AND DROP =====
        function initDragAndDrop() {
            const cards = container.querySelectorAll('.card');
            let draggingCard = null;

            cards.forEach(card => {
                const handle = card.querySelector('.drag-handle');
                if (!handle || handle._dndReady) return;
                handle._dndReady = true;

                handle.addEventListener('mousedown', () => { card.draggable = true; });
                document.addEventListener('mouseup', () => { card.draggable = false; }, { once: false });

                card.addEventListener('dragstart', e => {
                    draggingCard = card;
                    setTimeout(() => card.classList.add('dragging'), 0);
                    e.dataTransfer.effectAllowed = 'move';
                });
                card.addEventListener('dragend', () => {
                    card.draggable = false;
                    card.classList.remove('dragging');
                    draggingCard = null;
                    container.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
                    saveOrder();
                });
                card.addEventListener('dragover', e => {
                    e.preventDefault();
                    if (!draggingCard || card === draggingCard) return;
                    container.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
                    card.classList.add('drag-over');
                    const bounding = card.getBoundingClientRect();
                    if (e.clientY - bounding.top > bounding.height / 2) {
                        container.insertBefore(draggingCard, card.nextSibling);
                    } else {
                        container.insertBefore(draggingCard, card);
                    }
                });
                card.addEventListener('dragleave', () => { card.classList.remove('drag-over'); });
                card.addEventListener('drop', e => { e.preventDefault(); card.classList.remove('drag-over'); });
            });
        }

        async function saveOrder() {
            const order = Array.from(container.querySelectorAll('.card')).map(c => c.id.replace('card-', ''));
            await fetch('/api/tools/reorder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order })
            });
        }

        // ===== INLINE RENAME =====
        function startRename(id) {
            const nameEl = document.getElementById(`name-${id}`);
            if (!nameEl || nameEl.querySelector('input')) return;
            const currentName = nameEl.querySelector('.name-text').textContent.trim();
            nameEl.innerHTML = `<input id="rename-input-${id}" value="${currentName}" onblur="finishRename('${id}', '${currentName.replace(/'/g,"\\\'")}')" onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape') cancelRename('${id}', '${currentName.replace(/'/g,"\\\'")}')" style="width:200px">`;
            const input = document.getElementById(`rename-input-${id}`);
            input.focus();
            input.select();
        }

        async function finishRename(id, original) {
            const input = document.getElementById(`rename-input-${id}`);
            if (!input) return;
            const newName = input.value.trim() || original;
            const nameEl = document.getElementById(`name-${id}`);
            nameEl.innerHTML = `<span class="name-text">${newName}</span><span class="edit-icon" title="Double-click để đổi tên">✏️</span>`;
            nameEl.ondblclick = () => startRename(id);
            if (newName === original) return;
            const res = await fetch(`/api/tools/${id}/rename`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName })
            });
            const data = await res.json();
            showToast(data.success ? `Đã đổi tên thành "${newName}"` : data.message, data.success ? 'success' : 'error');
        }

        function cancelRename(id, original) {
            const nameEl = document.getElementById(`name-${id}`);
            if (nameEl) {
                nameEl.innerHTML = `<span class="name-text">${original}</span><span class="edit-icon" title="Double-click để đổi tên">✏️</span>`;
                nameEl.ondblclick = () => startRename(id);
            }
        }

        function toggleLogs(id) {
            document.getElementById(`log-${id}`).classList.toggle('visible');
        }

        function toggleExpand(id) {
            document.getElementById(`log-${id}`).classList.toggle('expanded');
        }

        async function fetchLogs(id) {
            try {
                const res = await fetch(`/api/tools/${id}/logs`);
                const data = await res.json();
                const term = document.getElementById(`log-${id}`);
                const content = document.getElementById(`log-content-${id}`);
                if(term && content && data.logs) {
                    const isScrolledToBottom = term.scrollHeight - term.clientHeight <= term.scrollTop + 30;
                    content.textContent = data.logs.join('\n') || "No log data yet...";
                    if(isScrolledToBottom) term.scrollTop = term.scrollHeight;
                }
            } catch(e) {}
        }

        async function startTool(id) {
            const res = await fetch(`/api/tools/${id}/start`, { method: 'POST' });
            const data = await res.json();
            showToast(data.message, data.success ? 'success' : 'error');
            fetchTools();
        }

        async function stopTool(id) {
            const res = await fetch(`/api/tools/${id}/stop`, { method: 'POST' });
            const data = await res.json();
            showToast(data.message, data.success ? 'success' : 'error');
            fetchTools();
        }

        async function shutdownDashboard() {
            const res = await fetch('/api/shutdown', { method: 'POST' });
            document.body.innerHTML = '<h1 style="text-align: center; margin-top: 50px; color: #ef4444;">Dashboard Offline</h1>';
        }

        async function restartDashboard() {
            const btn = document.getElementById('restart-dashboard-btn');
            btn.disabled = true;
            btn.textContent = '\u23F3 Restarting...';
            try {
                await fetch('/api/restart', { method: 'POST' });
                document.body.innerHTML = `
                    <div style="text-align:center; margin-top: 80px; font-family: Inter, sans-serif;">
                        <h1 style="color: #c084fc; font-size: 2rem;">&#x21BB; Dashboard restarting...</h1>
                        <p style="color: #94a3b8; margin-top: 1rem;">Tự reload sau 2 giây...</p>
                    </div>`;
                setTimeout(() => location.reload(), 2000);
            } catch(e) {
                btn.disabled = false;
                btn.textContent = '\u21BB Restart Dashboard';
                showToast('L\u1ed7i khi restart!', 'error');
            }
        }

        async function openLogInEditor(id) {
            try {
                const res = await fetch(`/api/tools/${id}/open_log`, { method: 'POST' });
                const data = await res.json();
                showToast(data.message, data.success ? 'success' : 'error');
            } catch(e) {
                showToast('L\u1ed7i khi m\u1edf log!', 'error');
            }
        }
        
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = "toast " + type;
            toast.textContent = msg;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        fetchTools();
        setInterval(fetchTools, 5000);
    </script>
</body>
</html>
